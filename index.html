<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Currency Converter</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="index.css" />
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar bg-black">
    <div class="container">
      <a class="navbar-brand text-white fw-bold" href="#">
        Currency Converter
      </a>
    </div>
  </nav>


  <!-- Main -->
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">

    <section class="converter-card p-4 rounded-4 shadow">

      <h1 class="text-center mb-4">
        Currency Converter
      </h1>


      <!-- Amount -->
      <div class="mb-3">

        <label for="amount" class="form-label">
          Amount
        </label>

        <input
          type="number"
          id="amount"
          class="form-control"
          value="1"
          min="0"
        />

      </div>


      <!-- From Currency -->
      <div class="mb-3">

        <label for="fromCurrency" class="form-label">
          From
        </label>

        <select
          id="fromCurrency"
          class="form-select">
        </select>

      </div>


      <!-- Swap Button -->
      <div class="text-center mb-3">

        <button
          id="swapBtn"
          type="button"
          class="btn btn-outline-primary rounded-circle"
        >
          ⇅
        </button>

      </div>


      <!-- To Currency -->
      <div class="mb-4">

        <label for="toCurrency" class="form-label">
          To
        </label>

        <select
          id="toCurrency"
          class="form-select">
        </select>

      </div>


      <!-- Convert Button -->
      <button
        id="convertBtn"
        type="button"
        class="btn btn-primary w-100"
      >
        Convert
      </button>


      <!-- Result -->
      <div
        id="result"
        class="text-center mt-4">
      </div>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="currencies.js"></script>
  <script src="script.js"></script>

</body>

</html>
